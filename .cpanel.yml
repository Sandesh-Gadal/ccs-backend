---
# cPanel Git Version Control deploy for the Laravel API + admin panel.
# The repo is deployed in place: point the api subdomain's document root
# at <this repo>/public in cPanel > Domains.
#
# Before the first deploy, create .env in the repo folder on the server
# (copy .env.example, fill in DB + APP_URL, run `php artisan key:generate`).
#
# Admin assets (public/build) are NOT built here because shared hosting has
# no Node. Run `npm run build` locally and commit public/build before pushing.
deployment:
  tasks:
    # Paths on the Himalayan Host server (CloudLinux alt-php 8.3, matches `php -v` in Terminal)
    - export PHP_BIN=/opt/alt/php83/usr/bin/php
    - export COMPOSER_BIN=/usr/local/bin/composer
    - cd "$HOME/repositories/ccs-backend"
    - $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
    - $PHP_BIN artisan migrate --force
    - '[ -L public/storage ] || $PHP_BIN artisan storage:link'
    - $PHP_BIN artisan optimize:clear
    - $PHP_BIN artisan config:cache
    - $PHP_BIN artisan route:cache
    - $PHP_BIN artisan view:cache
